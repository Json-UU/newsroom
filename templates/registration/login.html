{% extends 'base.html' %}
{% block content %}
<section class="form-panel"><p class="eyebrow">WELCOME BACK</p><h1>Sign in to your newsroom.</h1><p>Follow your interests. Keep up with the stories that matter.</p>

{% endblock %}
